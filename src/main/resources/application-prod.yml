spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: MinimarketHikariPool
      minimum-idle: ${DB_POOL_MIN_SIZE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: logstash

security:
  require-https: true
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
