server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: minimarket-api
  profiles:
    default: local
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.minimarket: ${LOG_LEVEL_APP:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /swagger.yml
    disable-swagger-default-url: true

security:
  require-https: false
  documentation-public: false
  jwt:
    issuer: ${JWT_ISSUER:minimarket-api}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:P30D}
  login-attempts:
    maximum: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_ATTEMPT_WINDOW:PT15M}
    block-duration: ${LOGIN_BLOCK_DURATION:PT15M}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador inicial}
